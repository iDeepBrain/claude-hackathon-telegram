services:
  telegram-bot:
    build: .
    env_file: .env
    environment:
      - AGENT_URL=http://agent:8000
      - TELEGRAM_MODE=polling
    depends_on:
      - agent
    networks:
      - hackathon

  agent:
    build: ../claude-hackathon-agent
    ports:
      - "8000:8000"
    env_file: ../claude-hackathon-agent/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MCP_URL=http://mcp:8001/mcp
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hackathon

  mcp:
    build: ../claude-hackathon-mcp
    env_file: ../claude-hackathon-mcp/.env
    networks:
      - hackathon

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hackathon

networks:
  hackathon:
    driver: bridge
